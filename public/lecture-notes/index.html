<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>从创意到作品｜最终版 21 页手机讲稿</title>
  <style>
    :root { color-scheme: dark; --bg:#171717; --fg:#f7f7f3; --muted:#a4a4a0; --line:#424242; --yellow:#ffeb00; --body-size:26px; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; background:var(--bg); color:var(--fg); -webkit-font-smoothing:antialiased; overscroll-behavior:none; }
    button { font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible { outline:3px solid var(--yellow); outline-offset:2px; }
    .app { height:100dvh; min-height:0; display:flex; flex-direction:column; max-width:760px; margin:auto; }
    .progress { height:5px; flex:none; background:#343434; }
    .progress span { display:block; height:100%; width:4.55%; background:var(--yellow); transition:width .22s ease; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:17px 20px 11px; flex:none; }
    .brand { font-size:12px; line-height:1.25; letter-spacing:.08em; color:var(--muted); font-weight:700; }
    .tools { display:flex; gap:5px; align-items:center; }
    .tool { min-width:42px; height:40px; border:1px solid var(--line); border-radius:8px; background:transparent; font-size:17px; font-weight:700; }
    .tool.menu { min-width:56px; font-size:14px; }
    main { flex:1; min-height:0; overflow-y:auto; overscroll-behavior-y:contain; padding:20px 24px 38px; scrollbar-width:thin; scrollbar-color:#555 transparent; }
    .eyebrow { color:var(--yellow); font-size:14px; font-weight:800; letter-spacing:.08em; margin-bottom:17px; }
    h1 { font-size:clamp(28px, 7.6vw, 45px); line-height:1.22; margin:0 0 17px; letter-spacing:-.035em; }
    .time { display:inline-block; color:var(--muted); font-size:14px; padding-bottom:17px; }
    .rule { width:38px; height:4px; background:var(--yellow); margin:0 0 29px; }
    .script { font-size:var(--body-size); font-weight:500; line-height:1.68; letter-spacing:.005em; }
    .script p { margin:0 0 25px; }
    .interaction { border-left:4px solid var(--yellow); background:#24241c; padding:15px 18px; margin-top:28px; font-size:19px; line-height:1.6; border-radius:0 9px 9px 0; }
    .interaction b { display:block; color:var(--yellow); font-size:14px; letter-spacing:.06em; margin-bottom:5px; }
    .cue { border-top:1px solid var(--line); margin-top:38px; padding-top:19px; font-size:17px; line-height:1.6; color:#c9c9c4; }
    .cue b { color:var(--yellow); font-size:14px; letter-spacing:.06em; margin-right:8px; }
    .nav { flex:none; display:grid; grid-template-columns:1fr auto 1fr; gap:9px; align-items:center; padding:10px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--bg); }
    .nav button { border:1px solid #555; border-radius:9px; background:#292929; min-height:54px; font-size:18px; font-weight:700; }
    .nav button.next { background:var(--yellow); color:#101010; border-color:var(--yellow); }
    .nav button:disabled { opacity:.32; cursor:default; }
    .counter { white-space:nowrap; min-width:68px; text-align:center; font-variant-numeric:tabular-nums; font-size:16px; color:var(--muted); }
    .drawer { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.75); display:none; align-items:flex-end; }
    .drawer.open { display:flex; }
    .sheet { background:#232323; width:100%; max-width:760px; margin:0 auto; border-radius:17px 17px 0 0; max-height:79dvh; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom); }
    .sheethead { padding:18px 20px 12px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); font-size:18px; font-weight:700; }
    .close { border:0; background:transparent; font-size:25px; width:40px; height:35px; }
    .toc { overflow-y:auto; padding:6px 12px 14px; }
    .toc button { width:100%; display:flex; gap:13px; align-items:baseline; text-align:left; padding:14px 11px; border:0; border-bottom:1px solid #393939; background:transparent; font-size:17px; line-height:1.35; }
    .toc button.active { color:var(--yellow); }
    .toc .num { font-size:13px; font-weight:800; width:25px; flex:none; color:var(--muted); }
    .toc button.active .num { color:var(--yellow); }
    @media (min-width:761px) { body{background:#0b0b0b}.app{border-left:1px solid #333;border-right:1px solid #333}.drawer{align-items:center}.sheet{border-radius:16px;max-height:75dvh} }
    @media (prefers-reduced-motion:reduce) { .progress span{transition:none} }
  </style>
</head>
<body>
  <div class="app">
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
    <header class="topbar">
      <div class="brand">从创意到作品<br>AI 如何辅助工业设计</div>
      <div class="tools">
        <button class="tool" id="smaller" aria-label="缩小字号">A−</button>
        <button class="tool" id="larger" aria-label="放大字号">A＋</button>
        <button class="tool menu" id="menu" aria-label="打开目录">目录</button>
      </div>
    </header>
    <main id="content" aria-live="polite">
      <div class="eyebrow" id="section"></div>
      <h1 id="title"></h1>
      <div class="time" id="time"></div>
      <div class="rule"></div>
      <div class="script" id="script"></div>
      <div class="interaction" id="interaction"></div>
      <div class="cue" id="cue"></div>
    </main>
    <footer class="nav">
      <button id="prev" aria-label="上一页">← 上一页</button>
      <span class="counter" id="counter"></span>
      <button class="next" id="next" aria-label="下一页">下一页 →</button>
    </footer>
  </div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="页码目录">
    <div class="sheet">
      <div class="sheethead">选择 PPT 页码<button class="close" id="close" aria-label="关闭目录">×</button></div>
      <div class="toc" id="toc"></div>
    </div>
  </div>
  <script>
  const pages = [
  {
    "section": "开场",
    "title": "从创意到作品：AI如何辅助工业设计",
    "lines": [
      "大家好，我是 David。今天用几组我实际做过的案例，聊聊 AI 能怎样帮我们探索设计、表达作品。",
      "主线是一盏白噪音唤醒灯。先看它的概念视觉，再看视频和官网。后面也会看展馆与服装案例。"
    ],
    "interaction": "先请大家看一眼封面上的产品，心里留一个问题：它看起来像一件完整产品了吗？先不用回答，下一页再举手。",
    "cue": "开场简短，别在这一页展开履历。",
    "time": "建议 1 分钟（含互动）"
  },
  {
    "section": "开场提问",
    "title": "这盏氛围灯，设计完成了吗？",
    "lines": [
      "先只看这张效果图。你们觉得它已经设计完成了吗？觉得“差不多完成”的举个手；觉得“还有很多事要做”的也举个手。",
      "我想听两位同学的理由。我的这组案例做到了视觉概念，但图上看不到真实使用与工程验证。我们待会儿再回到这个问题。"
    ],
    "interaction": "请两位同学各说一句理由，每人控制在 20 秒左右。接到回答后说“这个判断先记着”，继续往下讲。",
    "cue": "这张图是概念效果图，不要说成已经生产的产品。",
    "time": "建议 3 分钟（含互动）"
  },
  {
    "section": "讲座路线",
    "title": "今天，我们沿着一个产品往前走",
    "lines": [
      "这页是今天的路线。一个真正的产品需要考虑设计问题、概念探索、检验和表达。",
      "我这个案例实际做得最多的是中间的视觉探索与作品表达。前面的用户场景和后面的真实验证，今天会作为“下一步该问什么”来一起讨论。"
    ],
    "interaction": "让大家用手势选一下：现在最感兴趣的是“想法、做图、还是验证”？扫一眼即可，不逐个点名。",
    "cue": "把 PPT 的完整设计流程与自己的已完成工作分清楚。",
    "time": "建议 1 分钟（含互动）"
  },
  {
    "section": "关于我",
    "title": "David：AI实战导师 / 设计工作流实践者",
    "lines": [
      "我之前在企业做过视觉设计、汽车座舱和数字产品相关工作。现在也持续尝试把 AI 放进自己的设计工作流。",
      "今天不讲抽象的大道理，就用看得见的画面，聊聊我怎么做选择、怎么把一个概念继续往下表达。"
    ],
    "interaction": "问一句：“在座有多少同学已经用 AI 做过产品图或概念图？”举手后简短回应，不展开工具讨论。",
    "cue": "个人介绍控制在一分钟左右；投屏上的具体履历以你本人核实的版本为准。",
    "time": "建议 2 分钟（含互动）"
  },
  {
    "section": "案例 01 / 工业产品",
    "title": "白噪音唤醒灯",
    "lines": [
      "这是今天的主案例。最开始我做的是这盏灯的外观和发光氛围，后来又做了多角度图、概念视频和产品介绍官网。",
      "目前展示的是概念视觉成果。它还没有经过具体人群调研，也没有做出能测试唤醒效果的样机。"
    ],
    "interaction": "指向图中的几个角度，问：“你们第一眼记住的是外形，还是发光的部分？”请一位同学简答。",
    "cue": "第 5 页明确案例范围，让后续讲解站在真实做过的事情上。",
    "time": "建议 2 分钟（含互动）"
  },
  {
    "section": "案例 01 / 创作过程",
    "title": "这次，我主要完成了概念视觉",
    "lines": [
      "我做这个案例时，主要精力放在外观和视觉表达上。坦诚讲，当时没有先确定具体给谁用、放在什么地方用。",
      "我先尝试产品的外形和光效方向，生成画面、选择和调整，再把它延展成多角度图、视频和官网。"
    ],
    "interaction": "问：“如果只看现在这些图，你最想追问这件产品的哪一个问题？”收一个简短回答即可。",
    "cue": "这是你真实做过的创作过程，不要补出不存在的访谈或实测。",
    "time": "建议 2 分钟（含互动）"
  },
  {
    "section": "案例 01 / 画面回看",
    "title": "回看画面，我会检查四件事",
    "lines": [
      "回头看这组概念图，我可以从四个画面问题检查它：轮廓清不清楚，光感自不自然，材质是否可信，多个角度是否对应同一个造型。",
      "这些判断可以在图片上做。亮度是否舒服、能不能盲操作、放在床头稳不稳，要等有实物再试。"
    ],
    "interaction": "请大家在四项中挑一项最容易被 AI 画面“骗过去”的，举手或说一个词。点一位同学说明原因。",
    "cue": "按画面上的 01 到 04 指给学生看，互动不超过一分钟。",
    "time": "建议 3 分钟（含互动）"
  },
  {
    "section": "案例 01 / 给 AI 的任务",
    "title": "如果重写提示词，我会这样说",
    "lines": [
      "左边是很笼统的说法：“设计一盏好看的智能灯”。好看很主观，结果可能到处发散。",
      "如果今天重写视觉任务，我会把造型、材质、发光区域和画面氛围讲得更清楚，每轮只比较一个重点。这是我回看案例后的总结，不是声称我当时逐字用了右边这段话。"
    ],
    "interaction": "请同学给左边那句话加一个更具体的视觉要求，比如“发光区域”或“表面材质”。收两三个词即可。",
    "cue": "第 8 页是重新表述任务的示范；第 9 页才是 PPT 展示的具体提示词。",
    "time": "建议 3 分钟（含互动）"
  },
  {
    "section": "案例 01 / 形态探索",
    "title": "第一轮画面，先比较视觉方向",
    "lines": [
      "这一页放了案例的提示词。里面写了“太空极简、流线型、无缝衔接、悬浮感”，还要求概念草图、产品细节图和三视图。",
      "你们可以看出，这段话主要在指定外观语言和出图形式。它还没有回答具体谁来用，也没有解决结构问题。生成之后，我还得从图中挑出值得继续发展的方向。"
    ],
    "interaction": "指着提示词问：“这几个词里，哪一个最影响最后的产品轮廓？”请一位同学说一个词，再指回图上对应的位置。",
    "cue": "屏幕上有完整提示词，可照着几个关键短语讲，不必逐字念完。",
    "time": "建议 3 分钟（含互动）"
  },
  {
    "section": "案例 01 / 概念表达",
    "title": "这张图表达了什么？",
    "lines": [
      "到这一步，这张图把产品的体量、白色外壳的质感和发光氛围表达得比较清楚，适合拿来向别人说明视觉方向。",
      "但它没有告诉我们实际光照够不够、里面怎么放元件，也没有证明它真的能完成唤醒任务。"
    ],
    "interaction": "让大家看图 10 秒，问：“如果你要继续介绍这个概念，最想再补一张什么角度的图？”收一个回答。",
    "cue": "肯定效果图的表达价值，再自然过渡到下一页多视角。",
    "time": "建议 2 分钟（含互动）"
  },
  {
    "section": "案例 01 / 多视角",
    "title": "多角度，检查形态能否对上",
    "lines": [
      "现在把同一个概念换几个角度看。正面的开口、侧面的厚度、背面的轮廓和底座比例，最好能互相对应。",
      "AI 生成多视角时，有时会把某些细节改掉。所以这些图可以帮我们检查视觉一致性；真要制作，还需要尺寸明确的模型和图纸。"
    ],
    "interaction": "请大家找一处最值得核对的细节。点一位同学指图说明；如果暂时没发现明显问题，就说“保持一致本身也要逐张检查”。",
    "cue": "不要凭空断言画面里一定存在错误。",
    "time": "建议 3 分钟（含互动）"
  },
  {
    "section": "案例 01 / 动态表达",
    "title": "15 秒视频，让概念动起来",
    "lines": [
      "静态图可以看形态，短视频则能把光效变化和镜头中的产品氛围表现出来。我们先看这段 15 秒视频。",
      "看完以后，可以想想：镜头让你注意到哪里？灯光的变化传达了什么感觉？它仍然是一段概念演示。"
    ],
    "interaction": "视频结束后请一位同学说：“你记住了哪个镜头或哪一次光的变化？”回答控制在 20 秒。",
    "cue": "视频若不能播放，就指着这一页静帧讲镜头与光效；不要把概念视频讲成真实使用测试。",
    "time": "建议 3 分钟（含互动）"
  },
  {
    "section": "案例 01 / 产品官网",
    "title": "概念视频之后，用 GPT‑6 搭建产品官网",
    "lines": [
      "有了产品图、多角度画面和短视频，我接着用 GPT‑6 把这些素材组织成一套产品介绍网页。我再检查内容顺序、文字和视觉效果。",
      "现在打开上线后的页面，看首页怎样建立第一印象，往下又怎样展示不同角度和视频。网页是概念展示，实物问题还留待后续验证。"
    ],
    "interaction": "打开官网后问：“首页第一眼，你们先看到产品，还是先读文字？”让一位同学回答，再滚动到多视角和视频区。",
    "cue": "点击 PPT 图片或文字进入 https://weixubo281-code.github.io/white-noise-wake-light/ 。网页加载要留时间。",
    "time": "建议 4 分钟（含互动）"
  },
  {
    "section": "现场点评",
    "title": "如果由你来改，先动哪个地方？",
    "lines": [
      "现在我们换个角度：假设要把这盏概念灯进一步做成真的产品，就要补上前面还没做的使用研究。",
      "比如 PPT 上的三个问题：如果放在宿舍，灯光或声音会干扰谁？半睡半醒时能找到操作区吗？你会先做哪项实测？宿舍是这页的讨论假设，不是我已经验证过的使用场景。"
    ],
    "interaction": "请两到三位同学各选一个问题回答，每人 30 到 45 秒。追问一句“你会怎样试？”控制整页在 6 分钟内。",
    "cue": "这页把产品概念转到后续待验证的问题，别讲成项目既有调研结论。",
    "time": "建议 6 分钟（含互动）"
  },
  {
    "section": "方法迁移",
    "title": "同样的方法，还能走到哪里？",
    "lines": [
      "前面看的是一盏灯。视觉方向、概念图和作品呈现的方法，也能用到空间展示、服装概念和个人作品网站。",
      "接下来用三个不同方向的例子，看看各自最需要表达的是什么。"
    ],
    "interaction": "快速举手：对数字展馆、服装概念、个人网站，哪一类最感兴趣？以此引出后面案例。",
    "cue": "转场即可，不在本页逐个展开小图。",
    "time": "建议 1 分钟（含互动）"
  },
  {
    "section": "案例 02 / 数字展馆",
    "title": "祈年殿数字展馆",
    "lines": [
      "这组是祈年殿数字展馆。做网页时，第一屏需要先把主题和氛围建立起来，再给观众一个继续探索的入口。",
      "我打开网页给大家看一下：从第一屏往下，内容怎样接上，导航怎样告诉你下一步可以看什么。"
    ],
    "interaction": "打开网页首页后先停住，问：“你会先点哪里，为什么？”收一位同学回答后再滚动一屏。",
    "cue": "演示 https://weixubo281-code.github.io/qiniandian-web/ 。注意控制现场网页演示时间。",
    "time": "建议 3 分钟（含互动）"
  },
  {
    "section": "案例 03 / 数字展馆",
    "title": "自然博物馆：让建筑带出浏览路线",
    "lines": [
      "再看自然博物馆的网站。首页先让观众看到建筑整体，下一屏才逐渐解释结构和空间。",
      "两屏信息的次序很重要。观众先被什么吸引，再得到什么解释，会影响继续浏览的意愿。"
    ],
    "interaction": "指两张画面问：“如果把顺序倒过来，先讲结构再看建筑，感觉会怎样？”听一个简短回答。",
    "cue": "可打开 https://weixubo281-code.github.io/qianhai-museum-web/ ，只看入口与下一屏。",
    "time": "建议 3 分钟（含互动）"
  },

  const $ = id => document.getElementById(id);
  let index = 0;
  let storedSize = 26;
  try { storedSize = Number(localStorage.getItem('lecture-font-size')) || 26; } catch (_) {}
  let size = storedSize;
  size = Math.max(20, Math.min(36, size));
  document.documentElement.style.setProperty('--body-size', size + 'px');

  function render() {
    const p = pages[index];
    $('section').textContent = String(index + 1).padStart(2,'0') + ' / ' + pages.length + '   ' + p.section;
    $('title').textContent = p.title;
    $('time').textContent = p.time;
    $('script').replaceChildren(...p.lines.map(line => { const el=document.createElement('p'); el.textContent=line; return el; }));
    $('interaction').replaceChildren();
    const audience=document.createElement('b'); audience.textContent='台下互动';
    $('interaction').append(audience, document.createTextNode(p.interaction));
    $('cue').replaceChildren();
    const lead=document.createElement('b'); lead.textContent='现场提示';
    $('cue').append(lead, document.createTextNode(p.cue));
    $('counter').textContent = (index + 1) + ' / ' + pages.length;
    $('progress').style.width = ((index + 1) / pages.length * 100) + '%';
    $('prev').disabled = index === 0;
    $('next').disabled = index === pages.length - 1;
    $('content').scrollTop = 0;
    document.title = (index+1) + '/' + pages.length + ' · ' + p.title + '｜手机讲稿';
    try { history.replaceState(null,'','#p'+(index+1)); } catch (_) {}
    [...$('toc').children].forEach((node,i) => node.classList.toggle('active',i===index));
  }
  function go(n) { const to=Math.max(0,Math.min(pages.length-1,n)); if(to!==index){index=to;render();} }
  $('prev').addEventListener('click',()=>go(index-1));
  $('next').addEventListener('click',()=>go(index+1));
  $('smaller').addEventListener('click',()=>{size=Math.max(20,size-2);document.documentElement.style.setProperty('--body-size',size+'px');try{localStorage.setItem('lecture-font-size',size)}catch(_){}});
  $('larger').addEventListener('click',()=>{size=Math.min(36,size+2);document.documentElement.style.setProperty('--body-size',size+'px');try{localStorage.setItem('lecture-font-size',size)}catch(_){}});
  function closeMenu() { $('drawer').classList.remove('open'); }
  $('menu').addEventListener('click',()=>{$('drawer').classList.add('open');$('toc').children[index]?.scrollIntoView({block:'center'});});
  $('close').addEventListener('click',closeMenu);
  $('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))closeMenu();});
  pages.forEach((p,i)=>{const b=document.createElement('button');const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');b.append(n,document.createTextNode(p.title));b.addEventListener('click',()=>{go(i);closeMenu();});$('toc').append(b);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();if($('drawer').classList.contains('open'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(index-1)}});
  let sx=0,sy=0;
  $('content').addEventListener('touchstart',e=>{sx=e.changedTouches[0].screenX;sy=e.changedTouches[0].screenY;},{passive:true});
  $('content').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-sx,dy=e.changedTouches[0].screenY-sy;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3)go(index+(dx<0?1:-1));},{passive:true});
  const start = Number(location.hash.replace('#p',''));
  if(Number.isInteger(start)&&start>=1&&start<=pages.length)index=start-1;
  render();
  </script>
